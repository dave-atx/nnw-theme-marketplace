# Stuart Breckenridge themes: https://stuartbreckenridge.net/projects/netnewswire-themes/
#
# Stuart Breckenridge's themes. Each repository tags releases but attaches no
# .nnwtheme.zip asset and has no discovery topic, so each entry installs
# GitHub's archive of a pinned tag. GitHub doesn't count downloads for those.
# Bump a tag here when Stuart tags a new version.

version = 1

[[theme]]
id = "net.stuartbreckenridge.matrix"
source = "stuartbreckenridge/NNWMatrix"
description = "A theme inspired by The Matrix movies."
screenshot = "https://stuartbreckenridge.net/_astro/Simulator-Screenshot---iPad-Pro-13-inch--M5----2026-02-23-at-21.04.01-1.DDXBul2b_Z2db6j3.webp"

[theme.package]
tag = "v1.0.2"

[[theme]]
id = "net.stuartbreckenridge.padd"
source = "stuartbreckenridge/NNWThemePADD"
description = "A Star Trek PADD-inspired theme for NetNewsWire."
screenshot = "https://stuartbreckenridge.net/_astro/Dropped-Screenshot.RuXlAo9m_ZbUGJ5.webp"

[theme.package]
tag = "v1.0.1"

[[theme]]
id = "net.stuartbreckenridge.themes.financial-broadsheet"
source = "stuartbreckenridge/NNWThemesFinancialBroadsheet"
name = "Financial Broadsheet"
description = "A newspaper-style theme with a financial focus."
screenshot = "https://stuartbreckenridge.net/_astro/FinBroadSheet-Dark.D5k0JN0e_QgDT9.webp"

[theme.package]
tag = "1"
