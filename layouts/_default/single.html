<!doctype html>
<html lang="en">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main class="document">
      <header class="document-header">
        <p class="eyebrow">Theme authors</p>
        <h1>{{ .Title }}</h1>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </header>
      <article class="document-body">
        {{ .Content }}
      </article>
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
